# Adresy, které zná router aplikace (src/Router.jsx). Ostatní cesty dostanou
# index.html se skutečným stavem 404 - stránku 404 vykreslí aplikace, ale
# vyhledávače a odkazové kontroly vidí, že stránka neexistuje. Shodu s
# routerem hlídá test src/test/nginxRoutes.test.js.
map $uri $jmlp_spa_route {
    default 0;
    ~^/$ 1;
    ~^/(zavody|vysledky|aktuality|dokumenty|kontakty|zive|archiv-zprav|livetiming|registrace)/?$ 1;
    ~^/zavod/[^/]+/?$ 1;
    ~^/(admin|timekeeper)(/.*)?$ 1;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Skutečná IP návštěvníka. Na kontejner se chodí přes nginx na hostiteli
    # (jmlp.cz -> 127.0.0.1:8080), takže $remote_addr tu byla adresa Docker
    # brány - všechny návštěvy měly stejnou IP a unikátních návštěvníků vycházel
    # na dashboardu jeden za den. Nginx na hostiteli posílá pravou adresu
    # v X-Real-IP; věříme jí jen od Docker sítí a localhostu, takže ji klient
    # zvenku nepodvrhne. Díky tomu $remote_addr níž (X-Real-IP pro backend)
    # nese adresu návštěvníka.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # File upload size limit (for document uploads)
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Disable cache for index.html completely
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0";
    }

    # Service worker and manifest — short cache for offline support
    location ~ ^/(sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, max-age=0";
        add_header Service-Worker-Allowed "/";
    }

    # Cache static assets — hashed filenames ensure cache busting on new deploys
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Backend API proxy configuration
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream backend:8000;

    # Public API endpoints
    location ~ ^/registrations(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/visitor-log$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/clubs(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/races(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Cache-Control;
    }

    location ~ ^/racers(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/posts(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/season-results(/.*)?$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Veřejný seznam dokumentů. Pozor: SPA route je /dokumenty (česky),
    # tohle je API na /documents - nekoliduje to.
    location ~ ^/documents(/.*)?$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API endpoints (secured by JWT) - now under /api/admin prefix
    location /api/admin {
        # Handle OPTIONS for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Timekeeper API endpoints
    location /api/timekeeper {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI docs (only in development)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nahrané soubory - proxy na backend.
    #
    # `^~` je tu zásadní: bez něj má přednost regulární výraz pro statické
    # soubory výše (\.(js|css|png|jpg|...)$), protože nginx vyhodnocuje regexy
    # dřív než obyčejné prefixy. Nahraný obrázek se pak hledal mezi soubory
    # webu a vracel 404 - loga klubů a obrázky článků nešly stáhnout ani
    # zobrazit, zatímco PDF fungovalo, protože v tom výčtu přípon není.
    location ^~ /uploads/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: existující soubor, jinak index.html. Cesta, kterou router
    # nezná, dostane index.html se stavem 404 (viz map $jmlp_spa_route nahoře).
    location / {
        try_files $uri @spa;
    }

    location @spa {
        error_page 404 /index.html;
        if ($jmlp_spa_route = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
