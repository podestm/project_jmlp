# Hostitelský nginx: /etc/nginx/sites-available/preprodtest.jmlp.cz.conf
# (symlink do sites-enabled). HTTPS a přesměrování z 80 doplní
#   sudo certbot --nginx -d preprodtest.jmlp.cz
# Produkční jmlp.cz.conf se nemění.
server {
    listen 80;
    listen [::]:80;
    server_name preprodtest.jmlp.cz;

    # Celý test za heslem: obsahuje kopii ostrých dat závodníků.
    # Heslo: sudo htpasswd -c /etc/nginx/.htpasswd-preprodtest <jmeno>
    # Po certbotu spustit deploy/test/nginx-gate.sh: heslo se pak zadává
    # jen jednou (cookie na 90 dní), jinak se hlavička Bearer administrace
    # s heslem testu přetahuje a prohlížeč se ptá pořád dokola.
    auth_basic "JMLP test";
    auth_basic_user_file /etc/nginx/.htpasswd-preprodtest;

    # Nikdy neindexovat.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
