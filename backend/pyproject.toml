# Formatting and linting for the backend (.claude/rules/python.md). Run: ruff format . && ruff check .
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    # The formatter owns line length; long string literals (SQL, messages) are not split by force.
    "E501",
    # `Column == True` builds a SQL expression in SQLAlchemy; the "fix" (`is True`) breaks the query.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection: `Depends(...)` in argument defaults is the framework's pattern.
"app/**/*.py" = ["B008"]
# Tests import shared pytest fixtures from other test modules; the fixture parameter then "redefines" the import.
"app/tests/**/*.py" = ["B008", "F811"]

[tool.ruff.format]
quote-style = "double"
