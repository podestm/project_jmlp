# Mirrors `harness/verify.sh full`.
# - push to dev: gate for the automatic test deployment (deploy/test/auto-deploy-dev.sh
#   deploys a dev commit only after these jobs succeed on it).
# - pull request to dev: checks a branch before it is merged.
# - pull request to main: gate for production; make "frontend", "backend" and "harness"
#   required status checks in the main ruleset.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx eslint --quiet src
      - name: Style and import rules
        run: npm run -s check:styles && npm run -s check:imports
      - name: Unit tests
        run: npx vitest run --reporter=dot
      - name: Build
        run: npx vite build --logLevel error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database, same privilege model as harness/lib/backend-tests.sh:
      # the app user owns only jmlpcz_test.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: jmlpcz_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/jmlpcz_test?charset=utf8mb4
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (real MySQL)
        run: python -m pytest app/tests -q -p no:cacheprovider --disable-warnings

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Harness self-test (guard rules, state files, agent config)
        run: harness/tests/run.sh
