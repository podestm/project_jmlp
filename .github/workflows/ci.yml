# Checks mirror `harness/verify.sh full`. One run per commit:
# - push to dev: checks every dev commit; the test deployment (deploy/test/auto-deploy-dev.sh) waits for
#   it, and a PR dev -> main uses these results (its head is the same commit), so PRs to main do not
#   run again. Required status checks "frontend", "backend", "harness" in the main ruleset match them.
# - pull request to dev: checks a branch (e.g. a feature branch) before it is merged into dev.
# - push to main (= merged PR dev -> main): checks the merge commit, then the `deploy` job deploys it
#   to production (deploy/prod/README.md). Optional approval: required reviewers on the environment.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of a production deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format (Prettier)
        run: npx prettier --check --log-level warn .
      - name: Lint
        run: npx eslint --quiet src
      - name: Style and import rules
        run: npm run -s check:styles && npm run -s check:imports
      - name: Unit tests
        run: npx vitest run --reporter=dot
      - name: Build
        run: npx vite build --logLevel error

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database, same privilege model as harness/lib/backend-tests.sh:
      # the app user owns only jmlpcz_test.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: jmlpcz_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/jmlpcz_test?charset=utf8mb4
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Format and lint (Ruff)
        run: ruff format --check . && ruff check --output-format github .
      - name: Tests (real MySQL)
        run: python -m pytest app/tests -q -p no:cacheprovider --disable-warnings

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Harness self-test (guard rules, state files, agent config)
        run: harness/tests/run.sh

  deploy:
    # Only a push to main, i.e. a merged pull request dev -> main, and only after all checks passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, harness]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets live in this environment; add required reviewers there to get an Approve button.
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key can only run deploy/prod/ssh-deploy.sh on the server (command= in authorized_keys).
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" "deploy $GITHUB_SHA"
