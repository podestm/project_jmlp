# =============================================================================
# JMLP - Jediný Docker Compose soubor
#
# Všechny služby běží z tohoto souboru. Frontend je Nginx s produkčním
# buildem Vite aplikace, proxy na backend. Žádný druhý compose soubor.
#
# Použití:
#   ./rebuild.sh          - rebuild a restart všeho
#   ./rebuild.sh frontend - rebuild jen frontendu
#   ./rebuild.sh backend  - rebuild jen backendu
#   ./build.sh            - první nastavení s importem dat z GCS
# =============================================================================

services:
  db:
    image: mysql:8.0
    container_name: jmlp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jmlpcz}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MCP_MYSQL_USER: ${MCP_MYSQL_USER:-mcp_readonly}
      MCP_MYSQL_PASSWORD: ${MCP_MYSQL_PASSWORD:-default-dev-mcp-readonly-password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - jmlp
    command: ["--default-authentication-plugin=mysql_native_password","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: jmlp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend/app:/app/app
      - documents_data:/app/uploads/documents
    networks:
      - jmlp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ""
    container_name: jmlp-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - jmlp
      - caddy_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  documents_data:

networks:
  jmlp:
    driver: bridge
  caddy_net:
    external: true
