services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: jmlpcz
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-default-dev-root-password}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-default-dev-app-password}
      MCP_MYSQL_USER: ${MCP_MYSQL_USER:-mcp_readonly}
      MCP_MYSQL_PASSWORD: ${MCP_MYSQL_PASSWORD:-default-dev-mcp-readonly-password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: ["--default-authentication-plugin=mysql_native_password","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://app:default-dev-app-password@db:3306/jmlpcz?charset=utf8mb4}
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app
      - documents_data:/app/uploads/documents

  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  db_data:
  documents_data:
